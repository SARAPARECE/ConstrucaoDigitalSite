<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca | Construção Digital</title>
    <meta name="description" content="Normas, guias e ferramentas de apoio ao trabalho em construção digital." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="assets/logos/construcao-digital_logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (!theme) {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>

    <header class="site-header" id="topo" data-componente="cabecalho"></header>

    <section class="hero hero-sm" aria-labelledby="page-title">
      <div class="hero-grid" aria-hidden="true"></div>
      <div class="container hero-content">
        <div class="hero-copy">
          <p class="eyebrow"><span class="dash">_</span> Comunidade</p>
          <h1 id="page-title">
            <span class="h1-brand">Biblioteca</span>
            <span class="h1-tail">normas, guias e ferramentas</span>
          </h1>
          <p class="lead">Materiais de apoio ao trabalho em construção digital, dos formadores e de fontes de referência.</p>
        </div>
      </div>
    </section>

    <main id="conteudo">
      <section id="biblioteca" class="section">
        <div class="container">
          <div class="section-head">
            <h2><span class="dash">_</span> Recursos</h2>
            <p>Para acrescentar um recurso, edita o ficheiro conteudo/biblioteca.js.</p>
          </div>
          <div class="cards-3" data-lista="biblioteca"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-componente="rodape"></footer>

    <!-- Conteúdo do site. Para mudar textos ou acrescentar itens, edita estes ficheiros. -->
    <script src="conteudo/site.js"></script>
    <script src="conteudo/biblioteca.js"></script>
    <script src="assets/js/render.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
