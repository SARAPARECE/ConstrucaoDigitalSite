<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fórum | Construção Digital</title>
    <meta name="description" content="Fórum da Comunidade de Construção Digital: debates técnicos, dúvidas e casos de obra." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="assets/logos/construcao-digital_logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script>
      /* O site abre sempre em tema claro, independentemente do sistema do visitante.
         Quem carregar no botão da lua fica em escuro só durante a visita. */
      (function () {
        var theme;
        try { theme = sessionStorage.getItem('theme'); } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>

    <header class="site-header" id="topo" data-componente="cabecalho"></header>

    <section class="hero hero-sm" aria-labelledby="page-title">
      <div class="hero-grid" aria-hidden="true"></div>
      <div class="container hero-content">
        <div class="hero-copy">
          <p class="eyebrow"><span class="dash">_</span> Comunidade</p>
          <h1 id="page-title">
            <span class="h1-brand">Fórum</span>
            <span class="h1-tail">debates, dúvidas e ideias</span>
          </h1>
          <p class="lead">Um sítio para pôr questões técnicas, partilhar casos de obra e encontrar quem trabalha no mesmo problema.</p>
        </div>
      </div>
    </section>

    <main id="conteudo">
      <section id="forum" class="section">
        <div class="container split">
          <article class="reveal">
            <h2><span class="dash">_</span> Temas</h2>
            <p class="lead-sm" data-texto="forum.intro"></p>
            <ul class="pill-wrap" data-lista="forum-temas" data-tipo="pastilhas" aria-label="Temas do fórum"></ul>
          </article>
          <article class="reveal">
            <h2><span class="dash">_</span> Como participar</h2>
            <ol class="roadmap-list" data-lista="forum-passos" data-tipo="passos"></ol>
            <a class="btn btn-dark" href="mailto:geral@construcaodigital.com?subject=Acesso%20ao%20forum">Pedir acesso <i class="ico ico-arrow" aria-hidden="true"></i></a>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-componente="rodape"></footer>

    <!-- Conteúdo do site. Para mudar textos ou acrescentar itens, edita estes ficheiros. -->
    <script src="conteudo/site.js"></script>
    <script src="conteudo/forum.js"></script>
    <script src="assets/js/render.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
