<!doctype html>
<html lang="pt-PT" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notícias | Construção Digital</title>
    <meta name="description" content="Notícias da Comunidade de Construção Digital: cursos, projetos, visitas de estudo e atividades com o setor." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="assets/logos/construcao-digital_logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Saltar para o conteúdo</a>

    <header class="site-header" id="topo" data-componente="cabecalho"></header>

    <section class="hero hero-sm" aria-labelledby="page-title">
      <div class="hero-grid" aria-hidden="true"></div>
      <div class="container hero-content">
        <div class="hero-copy">
          <p class="eyebrow"><span class="dash">_</span> Comunidade</p>
          <h1 id="page-title">
            <span class="h1-brand">Notícias</span>
            <span class="h1-tail">o que vai acontecendo</span>
          </h1>
          <p class="lead">
            Cursos, visitas de estudo, projetos dos alunos e atividades com empresas e
            instituições do setor.
          </p>
        </div>
      </div>
    </section>

    <main id="conteudo">
      <section id="noticias" class="section">
        <div class="container">
          <div class="section-head">
            <h2><span class="dash">_</span> Todas as notícias</h2>
            <p>Da mais recente para a mais antiga.</p>
          </div>
          <!-- Para acrescentar uma notícia, edita o ficheiro conteudo/noticias.js -->
          <div class="news-grid" data-lista="noticias" data-tipo="cartoes"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-componente="rodape"></footer>

    <!-- Conteúdo do site. Para mudar textos ou acrescentar itens, edita estes ficheiros. -->
    <script src="conteudo/site.js"></script>
    <script src="conteudo/noticias.js"></script>
    <script src="assets/js/render.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
